<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>quickcareAI - Symptom Checker</title>

    <!-- CSS -->
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <!-- =========================
         HEADER
    ========================== -->
    <header class="header">
        <h1>🏥 quickcareAI</h1>
        <p class="tagline">
            Quick health triage for your community
        </p>
    </header>


    <!-- =========================
         MAIN CONTAINER
    ========================== -->
    <main class="container">

        <form action="/submit" method="POST" id="symptomForm">

            <!-- Patient Name -->
            <label for="patient_name">
                Patient Name
            </label>

            <input
                type="text"
                id="patient_name"
                name="patient_name"
                placeholder="e.g. Ramesh Kumar (optional)"
            >


            <!-- Patient Age -->
            <label for="patient_age">
                Age
            </label>

            <input
                type="number"
                id="patient_age"
                name="patient_age"
                placeholder="e.g. 35"
                min="0"
                max="100"
                required
            >


            <!-- Symptoms -->
            <label for="symptom_text">
                Describe Symptoms (Hindi or English)
            </label>

            <div class="textarea-wrapper">

                <textarea
                    id="symptom_text"
                    name="symptom_text"
                    rows="4"
                    placeholder="जैसे: बुखार, खांसी, सिर दर्द..."
                    required
                ></textarea>

                <!-- Microphone Button -->
                <button
                    type="button"
                    id="micBtn"
                    class="mic-btn"
                    title="Speak your symptoms"
                    aria-label="Speak your symptoms"
                >
                    🎤
                </button>

            </div>


            <!-- Voice Status -->
            <p
                id="micStatus"
                class="mic-status"
                aria-live="polite"
            ></p>


            <!-- Submit -->
            <button
                type="submit"
                class="submit-btn"
                id="submitBtn"
            >
                Check Symptoms →
            </button>

        </form>


        <!-- Example Symptoms -->
        <div class="example-hint">

            <strong>Try:</strong>

            बुखार · खांसी · सीने में दर्द ·
            उल्टी · चक्कर आना

        </div>

    </main>


    <!-- =========================
         LOADING OVERLAY
    ========================== -->
    <div
        class="loading-overlay"
        id="loadingOverlay"
    >

        <div class="loading-box">

            <div class="spinner"></div>

            <p>
                Analyzing symptoms...
            </p>

        </div>

    </div>


    <!-- =========================
         JAVASCRIPT
    ========================== -->

    <script src="{{ url_for('static', filename='script.js') }}"></script>

</body>

</html>
